<h1 align="center">
<TT>1SCF</TT> </h1>
<p align="left">PARAM keyword <TT>1SCF</TT> 
adds the MOPAC keyword <TT><a href="http://openmopac.net/manual/one_scf.html">1SCF</a> </TT> 
to every reference data set.&nbsp; This freezes the geometry, i.e., it prevents 
geometry optimization.</p>
